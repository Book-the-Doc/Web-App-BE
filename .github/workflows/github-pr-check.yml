name: Pull Request Checks

on:
  pull_request:
    branches:
      - "develop"
      - "main"
      - "prod"
  push:
    tags:
      - "v*"

jobs:
  test-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
